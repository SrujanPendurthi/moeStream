# moeStream engine settings. Relative paths resolve against this file.
pack_dir = "../lagunaLab/models/Laguna-XS-2.1-packed"
memory_gb = 14.0          # peak GPU memory the engine may use; omit to probe free memory
context_tokens = 131072   # longest session the KV reservation is sized for
kv_bits = 8               # 8 = q8 (default), 4 = q4, 0 = bf16 (lossless)
eviction = "lfu"          # lfu | lru | fifo
# half_life = 64          # lfu only; omitted = take it from the calibration file
calibration = "budget.json"
thinking = true           # Laguna's built-in <think> reasoning; the model's own default is on
port = 8081
tune = true               # false = serve with the saved tuning state, never trial
tuning_dir = "tuning"     # tuning state, log and quality reference
trace_tokens = 65536      # routing rows kept per layer for replay
